<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuraBot — Quadruped Robot Control Interface</title>
<style>
:root{
  --bg:#06111f; --panel:#0b1a2d; --panel2:#0e2138; --border:#1a3554;
  --text:#e8f1ff; --muted:#8fa8c5; --blue:#1688ff; --blue2:#39a0ff;
  --green:#28df91; --danger:#ff4966; --shadow:0 12px 35px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -20%,#123052 0,#06111f 48%,#040b14 100%);
font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);min-height:100vh}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}
.sidebar{background:rgba(5,16,29,.94);border-right:1px solid var(--border);padding:24px 12px;display:flex;flex-direction:column}
.brand{padding:2px 14px 28px;font-size:22px;font-weight:750}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:5px}
.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;padding:14px 15px;border-radius:9px;text-align:left;cursor:pointer;color:#b9cce3}
.nav button:hover,.nav button.active{background:linear-gradient(90deg,#0759b8,#063c80);color:white}
.robot-mark{margin-top:auto;padding:18px 14px;color:var(--muted);font-size:12px;line-height:1.65}
.main{min-width:0}
.topbar{height:76px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(5,16,29,.55)}
.topbar h1{font-size:20px;margin:0}.topbar span{font-size:12px;color:var(--muted)}

.content{padding:24px;display:grid;grid-template-columns:1fr;gap:20px}
.left{display:grid;gap:20px;min-width:0}.panel{background:linear-gradient(145deg,rgba(14,33,56,.94),rgba(7,21,36,.94));border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.panel-title{height:54px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);font-size:16px;font-weight:650}
.control{display:grid;grid-template-columns:235px 1fr;gap:20px;padding:18px}
.joystick-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.joystick{width:190px;height:190px;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 30%,#183b61,#0a1c31 70%);border:1px solid #315477;box-shadow:inset 0 0 0 12px #0a1a2c,0 8px 25px rgba(0,0,0,.3);touch-action:none;user-select:none;cursor:grab}
.joystick:active{cursor:grabbing}
.joystick-ring{position:absolute;inset:22px;border:1px solid #244563;border-radius:50%}
.joystick-axis{position:absolute;background:#1b3855;opacity:.8}
.joystick-axis.horizontal{height:1px;left:18px;right:18px;top:50%}
.joystick-axis.vertical{width:1px;top:18px;bottom:18px;left:50%}
.joystick-knob{position:absolute;width:66px;height:66px;left:62px;top:62px;border-radius:50%;background:linear-gradient(145deg,#42a9ff,#086bd0);border:2px solid #6bc0ff;box-shadow:0 7px 18px rgba(0,0,0,.4),0 0 18px rgba(22,136,255,.25);pointer-events:none}
.joystick-caption{font-size:11px;color:var(--muted);letter-spacing:.4px}
.range{margin-top:22px}.range label{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:9px}
input[type=range]{width:100%;accent-color:var(--blue)}
.servos{padding:16px;display:grid;grid-template-columns:repeat(8,1fr);gap:10px}.servo{border:1px solid var(--border);border-radius:7px;padding:13px 8px;text-align:center}.servo-name{font-size:11px;color:var(--muted)}.knob{width:44px;height:44px;border-radius:50%;margin:10px auto;border:5px solid #102b48;border-top-color:var(--blue);border-right-color:var(--blue);transform:rotate(25deg)}.servo-value{font-size:12px}
.gaits{padding:16px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.gait-btn{border:1px solid var(--border);background:#10263f;padding:16px 8px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#b9cce3;transition:border-color .15s,background .15s,color .15s}
.gait-btn:hover{border-color:#2a79bd}
.gait-btn .gait-name{font-size:12px;font-weight:600}
.gait-btn.active{background:linear-gradient(145deg,#1688ff,#086bd0);border-color:#6bc0ff;color:#fff;box-shadow:0 7px 18px rgba(0,0,0,.35),0 0 18px rgba(22,136,255,.25)}
@media(max-width:700px){.gaits{grid-template-columns:repeat(3,1fr)}}
@media(max-width:420px){.gaits{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1050px){.app{grid-template-columns:80px 1fr}.brand{font-size:0}.brand:before{content:"NB";font-size:20px}.nav button{font-size:0;text-align:center}.nav button:before{content:"●";font-size:14px}.robot-mark{display:none}.servos{grid-template-columns:repeat(4,1fr)}}
@media(max-width:700px){.content{padding:12px}.topbar{padding:0 15px}.control{grid-template-columns:1fr}.servos{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">NeuraBot<small>Quadruped Robot Control Interface</small></div>
    <nav class="nav">
      <button class="active">Control</button>
    </nav>
    <div class="robot-mark"><b>NeuraBot</b><br>8-DOF Quadruped Robot<br>Raspberry Pi 5 + Dual ESP32</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1>NeuraBot</h1><span>Quadruped Robot Control Interface</span></div>
      
    </header>

    <section class="content">
      <div class="left">
        <div class="panel">
          <div class="panel-title">Movement Control</div>
          <div class="control">
            <div class="joystick-wrap">
              <div class="joystick" id="joystick" aria-label="Movement joystick">
                <div class="joystick-ring"></div>
                <div class="joystick-axis horizontal"></div>
                <div class="joystick-axis vertical"></div>
                <div class="joystick-knob" id="joystickKnob"></div>
              </div>
              <div class="joystick-caption">Drag to move</div>
            </div>
            <div>
              <div class="range">
                <label>Master Controller <b id="speedVal">50%</b></label>
                <input type="range" value="50" oninput="speedVal.textContent=this.value+'%'">
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">Gait Selection</div>
          <div class="gaits" id="gaits">
            <button class="gait-btn active" data-gait="Stand"><span class="gait-name">Stand</span></button>
            <button class="gait-btn" data-gait="Walk"><span class="gait-name">Walk</span></button>
            <button class="gait-btn" data-gait="Trot"><span class="gait-name">Trot</span></button>
            <button class="gait-btn" data-gait="Sit"><span class="gait-name">Sit</span></button>
            <button class="gait-btn" data-gait="Shake"><span class="gait-name">Shake</span></button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">Servo Control</div>
          <div class="servos" id="servos"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>

const joystick = document.getElementById('joystick');
const joystickKnob = document.getElementById('joystickKnob');
let joystickActive = false;
let lastDirection = 'stop';

function setJoystick(clientX, clientY) {
  const rect = joystick.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const max = rect.width / 2 - 35;
  let dx = clientX - centerX;
  let dy = clientY - centerY;
  const distance = Math.hypot(dx, dy);
  if (distance > max) {
    dx = dx / distance * max;
    dy = dy / distance * max;
  }
  joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;

  const deadzone = 14;
  let direction = 'stop';
  if (Math.hypot(dx, dy) > deadzone) {
    if (Math.abs(dx) > Math.abs(dy) * 1.35) direction = dx > 0 ? 'right' : 'left';
    else if (Math.abs(dy) > Math.abs(dx) * 1.35) direction = dy > 0 ? 'backward' : 'forward';
    else direction = `${dy > 0 ? 'backward' : 'forward'}-${dx > 0 ? 'right' : 'left'}`;
  }
  if (direction !== lastDirection) {
    lastDirection = direction;
  }
}

function resetJoystick() {
  joystickActive = false;
  joystickKnob.style.transform = 'translate(0, 0)';
  if (lastDirection !== 'stop') {
    lastDirection = 'stop';
  }
}

joystick.addEventListener('pointerdown', event => {
  joystickActive = true;
  joystick.setPointerCapture(event.pointerId);
  setJoystick(event.clientX, event.clientY);
});
joystick.addEventListener('pointermove', event => {
  if (joystickActive) setJoystick(event.clientX, event.clientY);
});
joystick.addEventListener('pointerup', resetJoystick);
joystick.addEventListener('pointercancel', resetJoystick);
joystick.addEventListener('lostpointercapture', resetJoystick);

const servoValues=[32,48,27,41,36,52,29,45];
const servos=document.getElementById('servos');
servoValues.forEach((v,i)=>{
  const el=document.createElement('div');
  el.className='servo';
  el.innerHTML=`<div class="servo-name">Servo ${i+1}</div><div class="knob" style="transform:rotate(${v*1.4-50}deg)"></div><div class="servo-value">${v}°</div>`;
  servos.appendChild(el);
});

const gaitButtons=document.querySelectorAll('.gait-btn');
gaitButtons.forEach(btn=>{
  btn.addEventListener('click',()=>{
    gaitButtons.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});
</script>
</body>
</html>
